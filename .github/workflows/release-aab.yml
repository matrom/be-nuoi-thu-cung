name: Build signed AAB for Google Play

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Release AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Sign AAB with upload key
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > upload.jks
          jarsigner -keystore upload.jks -storepass "$KS_PASS" -sigalg SHA256withRSA -digestalg SHA-256 \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          cp android/app/build/outputs/bundle/release/app-release.aab app-release-signed.aab

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: be-nuoi-thu-cung-aab
          path: app-release-signed.aab
