<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFB74D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Bé Nuôi Thú Cưng</title>
<style>
:root{--bg:#FFF9E6;--mint:#E8F5E9;--peach:#FFB74D;--green:#81C784;--star:#FFD54F;--coral:#EF9A9A;--ink:#4E342E;--card:#fff;--cink:#4E342E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2218;--mint:#243326;--ink:#f4ead8}}
:root[data-theme="dark"]{--bg:#2b2218;--mint:#243326;--ink:#f4ead8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;font-family:Nunito,"Varela Round",system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--bg),var(--mint))}
body{background:linear-gradient(var(--bg),var(--mint));background-color:var(--bg)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:12px 16px;position:relative;overflow:hidden;text-align:center}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.play{width:min(280px,80vw);height:120px;border-radius:60px;font-size:30px;font-weight:800;color:#fff;background:linear-gradient(#FFB74D,#FF9800);box-shadow:0 8px 0 #E65100;animation:pulse 1.6s infinite}
.play:active{transform:translateY(4px);box-shadow:0 4px 0 #E65100}
.sec{height:64px;width:min(260px,70vw);border-radius:32px;font-size:22px;font-weight:700;background:var(--card);color:var(--cink);box-shadow:0 5px 0 #0002}
.ib{width:64px;height:64px;border-radius:50%;font-size:30px;background:var(--card);box-shadow:0 4px 0 #0002;margin:0 8px}
.gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;width:48px;height:48px;font-size:26px;background:none;opacity:.4}
.logo span{display:inline-block;font-size:clamp(46px,15vw,70px);animation:bob 1.2s infinite ease-in-out}
.best{font-size:28px;font-weight:800}
.top{display:flex;justify-content:space-between;width:100%;font-size:26px;font-weight:800;align-items:center;padding:2px 0}
.top-nav{display:flex;gap:8px;align-items:center}
.nav-btn{width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--cink);border:2px solid var(--peach);box-shadow:0 3px 0 #0002;font-size:20px;display:inline-flex;align-items:center;justify-content:center;transition:transform .1s,box-shadow .1s;padding:0;cursor:pointer}
.nav-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0002}
.hearts span{font-size:36px;margin-left:4px}.hearts .off{opacity:.2;filter:grayscale(1)}.hearts .last{animation:pulse 1s infinite}
.bar{width:100%;height:16px;border-radius:8px;background:#0002;overflow:hidden}.bar i{display:block;height:100%;background:var(--star);transition:width .4s}
.bub{width:112px;height:112px;border-radius:50%;background:#fff;border:5px solid var(--peach);display:flex;align-items:center;justify-content:center;font-size:56px;color:#4E342E;animation:bob 1.5s infinite ease-in-out;transition:opacity .5s;position:relative}
.bub:after{content:"";position:absolute;bottom:-16px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:16px solid var(--peach);border-bottom:0}
.bub.blink{animation:bob 1.5s infinite,blink 2.4s infinite}.bub.dim{opacity:.3}.bub.hide{opacity:0}.bub.hint{animation:pulse .6s 3}
.an{font-size:clamp(110px,34vw,210px);line-height:1;animation:breathe 2s infinite ease-in-out;position:relative}
.an.hop{animation:hop .6s}.an.tilt{animation:tilt .7s 2}.an.dance{animation:dance .8s infinite}.an.sad{transform:translateY(12px) scale(.95);filter:saturate(.6)}
.an em{position:absolute;top:0;right:-6px;font-size:44px;font-style:normal}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;width:min(380px,100%)}
.opt{min-height:120px;height:140px;border-radius:32px;background:var(--card);color:var(--cink);border:4px solid var(--c,#81C784);box-shadow:0 6px 0 #00000026;font-size:60px;display:flex;align-items:center;justify-content:center;transition:transform .1s,opacity .4s}
.opt:active{transform:translateY(4px) scale(.95);box-shadow:0 2px 0 #00000026}
.opt.ok{background:#81C784;transform:scale(1.2);z-index:2}.opt.no{border-color:#e53935;animation:shake .3s}.opt.fade{opacity:.5}
body.hc .opt{border-width:6px;border-color:#000}
.dot{display:inline-block;width:56px;height:56px;border-radius:50%;box-shadow:inset 0 -5px 0 #0003}
.sh{font-size:64px;line-height:1}.cnt{font-size:30px;line-height:1.1;word-break:break-all}
.big{font-size:84px;font-weight:800;color:#FF9800}
#ov{position:absolute;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
.dash{align-items:stretch;text-align:left;justify-content:flex-start;gap:10px;overflow:auto;font-size:18px;padding-top:56px}
.dash .row{display:flex;justify-content:space-between;align-items:center;gap:8px}.dash button.sm{padding:8px 14px;border-radius:14px;background:var(--peach);color:#3b2a1a;font-weight:700}
.pg{display:flex;gap:12px}.pg button{width:72px;height:72px;border-radius:20px;font-size:34px;font-weight:800;background:var(--card);color:var(--cink)}
.cf{position:absolute;top:-30px;width:12px;height:12px;border-radius:3px;animation:fall 3s linear forwards;pointer-events:none}
.fl{position:absolute;font-size:40px;animation:fly .8s ease-out forwards;pointer-events:none}
body.rm *{animation:none!important;transition:none!important}
@keyframes pulse{50%{transform:scale(1.05)}}@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes breathe{50%{transform:scaleY(1.02)}}@keyframes blink{50%{opacity:.25}}
@keyframes hop{40%{transform:translateY(-30px) scale(1.05)}}@keyframes tilt{50%{transform:rotate(-10deg)}}
@keyframes dance{25%{transform:rotate(-8deg) translateY(-8px)}75%{transform:rotate(8deg) translateY(-8px)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}@keyframes fly{to{transform:translateY(-90px) scale(1.5);opacity:0}}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app'),pick=a=>a[Math.floor(Math.random()*a.length)],shuf=a=>[...a].sort(()=>Math.random()-.5);

try{Object.assign(D,JSON.parse(localStorage.getItem('pcare')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('pcare',JSON.stringify(D))}catch(e){}},day=()=>new Date().toDateString();
const apply=()=>{document.body.classList.toggle('rm',!!D.rm);document.body.classList.toggle('hc',!!D.hc)};apply();
let AC;const tone=(f,d,t,s,sw)=>{if(!D.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime+(s||0),o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(sw)o.frequency.exponentialRampToValueAtTime(sw,n+d);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}};
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n||25)}catch(e){}};
const sPop=()=>tone(700,.1,'square',0,1000),sTing=()=>{tone(880,.15,'triangle');tone(1320,.2,'triangle',.1)},sBoop=()=>tone(180,.25,'sine',0,120),sCoin=()=>tone(1000,.1,'square',.15,1500),sFan=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',i*.1));
const PE=[261,294,330,392,440,392,330,294];let mi=0;setInterval(()=>{if(D.mus&&AC&&!document.hidden){tone(PE[mi++%8],.4,'sine')}},600);
const timers=[];const later=(f,ms)=>timers.push(setTimeout(f,ms)),clr=()=>{timers.splice(0).forEach(clearTimeout)};
let cur='';setInterval(()=>{if(cur==='game'&&!document.hidden){D.t[day()]=(D.t[day()]||0)+1;ses++;if(D.t[day()]%10===0)save();
 if(D.lim&&D.t[day()]>=D.lim*60&&!ov)rest();else if(D.eye&&ses%600===0&&!ov)eyes()}},1000);let ses=0,ov=0;
const PETS=[['🐰',0],['🐱',5],['🐻',10],['🐶',15],['🐵',25],['🐹',35],['🦊',45],['🐼',60]],un=()=>PETS.filter(p=>D.best>=p[1]).map(p=>p[0]);
function confetti(n){if(D.rm)return;for(let i=0;i<(n||50);i++){const c=document.createElement('i');c.className='cf';c.style.left=Math.random()*100+'%';c.style.background=pick(['#FFB74D','#81C784','#FFD54F','#EF9A9A','#90CAF9']);c.style.animationDelay=Math.random()*.8+'s';A.appendChild(c);setTimeout(()=>c.remove(),3800)}}
function splash(){cur='splash';A.innerHTML='<div class="logo"><span>🐰</span><span style="animation-delay:.3s">🐱</span><span style="animation-delay:.6s">🐻</span><span style="animation-delay:.9s">🐶</span></div><div class="big" style="font-size:44px">🐾</div>';setTimeout(home,2000)}
function home(){cur='home';clr();A.innerHTML=`<button class="gear" id="pg" aria-label="Dành cho phụ huynh">⚙️</button><div class="logo">${['🐰','🐱','🐻','🐶'].map((a,i)=>`<span style="animation-delay:${i*.3}s">${a}</span>`).join('')}</div><button class="play" id="go" aria-label="Chơi ngay">▶️ CHƠI NGAY</button><div class="best" aria-label="Điểm cao nhất ${D.best}">🏆 ⭐ ${D.best}</div><div><button class="ib" id="sn" aria-label="Âm thanh">${D.snd?'🔊':'🔇'}</button><button class="ib" id="mu" aria-label="Nhạc nền">${D.mus?'🎵':'🔕'}</button><button class="ib" id="co" aria-label="Bộ sưu tập thú cưng">🐾</button></div>`;
 $('#go').onclick=()=>{sPop();start()};$('#pg').onclick=gate;$('#sn').onclick=()=>{D.snd=!D.snd;save();home()};$('#mu').onclick=()=>{D.mus=!D.mus;save();home()};$('#co').onclick=coll}
function coll(){cur='coll';try{history.pushState({p:'c'},'')}catch(e){}A.innerHTML=`<div class="best">🐾 ${un().length}/${PETS.length}</div><div class="opts">${PETS.map(([p,t])=>`<div class="opt" style="min-height:96px;height:110px;opacity:${D.best>=t?1:.35}" aria-label="${D.best>=t?'Đã mở':'Chưa mở, cần '+t+' sao'}">${D.best>=t?p:'🔒'}</div>`).join('')}</div><div style="font-size:26px">${D.stk.slice(-8).join(' ')}</div><button class="sec" id="b" style="display:flex;align-items:center;justify-content:center;gap:8px">🏠 <span>VỀ TRANG CHỦ</span></button>`;$('#b').onclick=home}
/* questions */
const COL=[['#e53935','đỏ'],['#1e88e5','xanh dương'],['#fdd835','vàng'],['#43a047','xanh lá'],['#8e24aa','tím'],['#fb8c00','cam']],SHP=[['●','tròn'],['▲','tam giác'],['■','vuông'],['★','ngôi sao'],['♥','trái tim']],PR=[['🐰','🥕','cà rốt'],['🐱','🐟','cá'],['🐻','🍯','mật ong'],['🐶','🦴','xương'],['🐵','🍌','chuối'],['🐹','🌻','hoa hướng dương']];
const dot=c=>`<i class="dot" style="background:${c[0]}"></i>`;
function gen(L){const t=pick(L>0?['color','shape','pair','count']:['color','shape','pair']),k=[2,3,4,4][L];let an=pick(un()),h,o;
 if(t==='color'){const c=pick(COL);h=dot(c);o=[c,...shuf(COL.filter(x=>x!==c)).slice(0,k-1)].map((x,i)=>({h:dot(x),l:x[1],ok:!i}))}
 if(t==='shape'){const s=pick(SHP);h=`<b class="sh" style="color:#e53935">${s[0]}</b>`;o=[s,...shuf(SHP.filter(x=>x!==s)).slice(0,k-1)].map((x,i)=>({h:`<b class="sh" style="color:#1e88e5">${x[0]}</b>`,l:x[1],ok:!i}))}
 if(t==='pair'){const p=pick(PR);an=p[0];h=p[1];o=[p,...shuf(PR.filter(x=>x!==p)).slice(0,k-1)].map((x,i)=>({h:x[1],l:x[2],ok:!i}))}
 if(t==='count'){const n=1+Math.floor(Math.random()*5);h=`<span class="cnt" style="color:#4E342E">${'●'.repeat(n)}</span>`;o=[n,...shuf([1,2,3,4,5].filter(x=>x!==n)).slice(0,k-1)].map((x,i)=>({h:`<span class="cnt">${'🍎'.repeat(x)}</span>`,l:x+' quả táo',ok:!i}))}
 return{t,an,h,o:shuf(o)}}
const lv=s=>s<6?0:s<16?1:s<31?2:3;let sc=0,wr=0,lk=0,q;
function start(){clr();if(D.lim&&(D.t[day()]||0)>=D.lim*60)return rest();try{history.pushState({p:'g'},'')}catch(e){}sc=0;wr=0;next()}
function hud(){return `<div class="top"><div class="top-nav"><button class="nav-btn" id="nb-back" aria-label="Quay lại / Tạm dừng" title="Tạm dừng / Quay lại">←</button><button class="nav-btn" id="nb-home" aria-label="Về trang chủ" title="Về trang chủ">🏠</button></div><span id="sc">⭐ ${sc}</span><span class="hearts" aria-label="${3-wr} mạng">${[0,1,2].map(i=>`<span class="${i>=3-wr?'off':3-wr===1?'last':''}">❤️</span>`).join('')}</span></div><div class="bar"><i style="width:${(sc%5)*20}%"></i></div>`}
function pauseModal(){clr();if(sc>D.best){D.best=sc;save()}const d=modal(`<div style="font-size:52px">⏸️</div><div style="font-size:24px;font-weight:800;color:var(--cink)">BÉ MUỐN NGHỈ HẢ?</div><div style="font-size:20px;font-weight:700;color:#FF9800">⭐ Điểm của bé: ${sc}</div><button class="play" id="pm-res" style="height:76px;font-size:24px;width:min(260px,80vw)">▶️ CHƠI TIẾP</button><button class="sec" id="pm-hm" style="height:56px;font-size:20px;width:min(260px,80vw);margin-top:6px">🏠 VỀ TRANG CHỦ</button>`);$('#pm-res').onclick=()=>{ov=0;d.remove();next()};$('#pm-hm').onclick=()=>{ov=0;d.remove();home()}}
function next(){clr();cur='game';lk=0;const L=lv(sc);q=gen(L);const C=['#81C784','#FFB74D','#90CAF9','#CE93D8'];
 A.innerHTML=`${hud()}<div class="bub ${L==1?'blink':''}" id="bb" aria-label="Thú muốn món này">${q.h}</div><div class="an ${L==3?'dance':''}" id="an">${q.an}</div><div class="opts">${q.o.map((x,i)=>`<button class="opt" style="--c:${C[i]}" data-i="${i}" aria-label="${x.l}">${x.h}</button>`).join('')}</div>`;
 if(L==2)later(()=>$('#bb')&&$('#bb').classList.add('dim'),2000);
 if(L==3){later(()=>{const b=$('#bb');if(b){b.classList.add('hide');const a=$('#an');a.classList.remove('dance');a.classList.add('tilt');a.insertAdjacentHTML('beforeend','<em>👉</em>')}},1500)}
 A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>ans(b));
 const bBk=$('#nb-back'),bHm=$('#nb-home');
 if(bBk)bBk.onclick=pauseModal;
 if(bHm)bHm.onclick=()=>{if(sc>D.best){D.best=sc;save()}home()}}
function sk(t,ok){const L=lv(sc);[t,...(L>1?['mem']:[])].forEach(k=>{const r=D.sk[k]=D.sk[k]||[0,0];r[1]++;if(ok)r[0]++})}
function ans(b){if(lk)return;const x=q.o[b.dataset.i],an=$('#an');vib();sPop();sk(q.t,x.ok);
 if(x.ok){lk=1;wr=0;sc++;b.classList.add('ok');A.querySelectorAll('.opt').forEach(o=>o!==b&&o.classList.add('fade'));an.className='an hop';sTing();sCoin();vib(60);
  const f=document.createElement('div');f.className='fl';f.textContent='⭐';f.style.left='20px';f.style.top='20px';A.appendChild(f);setTimeout(()=>f.remove(),900);confetti(14);
  if(sc%5===0){const s=pick(['🦄','🌈','🌻','🦋','🎈','🍓','🐝','🌷']);D.stk.push(s);later(()=>{an.style.transition='transform .6s';an.style.transform='rotate(360deg)';sFan()},300)}
  if(sc>D.best){D.best=sc}save();later(next,sc%5===0?1400:1000)}
 else{lk=1;wr++;b.classList.add('no');sBoop();vib(15);$('#sc')&&0;const bb=$('#bb');if(bb){bb.classList.remove('dim','hide','blink');bb.classList.add('hint')}an.className='an tilt';an.insertAdjacentHTML('beforeend','<em>❓</em>');
  const hs=A.querySelector('.hearts');if(hs)hs.outerHTML=hud().match(/<span class="hearts[\s\S]*?<\/span><\/span>/)[0];
  if(wr>=3){an.className='an sad';later(over,1000)}else later(()=>{lk=0;b.classList.remove('no');b.style.opacity=.5;b.disabled=true},500)}}
function over(){cur='over';clr();D.g++;const nb=sc>0&&sc>=D.best&&sc>(D.pb||0);const old=D.pb||0;if(sc>old){D.pb=sc}save();
 A.innerHTML=`<div style="font-size:60px">🎉</div><div style="font-size:26px;font-weight:800">⭐ ĐIỂM CỦA BÉ ⭐</div><div class="big" id="n">0</div><div class="best">🏆 ${D.best} ⭐</div>${nb?'<div style="font-size:30px;font-weight:800">🏆✨ KỶ LỤC MỚI! 🎊</div>':''}<div class="an" style="font-size:90px;animation:dance 1s infinite">${pick(un())}👋</div><button class="play" id="re" style="animation:blink 1s infinite;height:100px">🔄 CHƠI LẠI</button><button class="sec" id="hm">🏠 VỀ NHÀ</button>`;
 confetti(50);sFan();let i=0;const n=$('#n'),st=Math.max(1,Math.ceil(sc/20)),iv=setInterval(()=>{i=Math.min(sc,i+st);n.textContent=i;tone(900,.04,'square');if(i>=sc)clearInterval(iv)},75);
 $('#re').onclick=()=>{clearInterval(iv);start()};$('#hm').onclick=()=>{clearInterval(iv);home()}}
function modal(h){ov=1;const d=document.createElement('div');d.id='ov';d.innerHTML=h;A.appendChild(d);return d}
function rest(){clr();const d=modal('<div class="big">😴</div><div style="font-size:60px">🌙</div><button class="sec" id="x">🏠</button>');$('#x').onclick=()=>{ov=0;home()}}
function eyes(){const d=modal('<div class="big">👀</div><div style="font-size:50px">🌳☁️🌈</div><button class="play" id="x" style="animation:none">👍</button>');$('#x').onclick=()=>{ov=0;d.remove()}}
/* parent */
let bad=0,lockUntil=0;
function gate(){cur='gate';const seq=shuf([1,2,3,4,5,6,7,8,9]).slice(0,3);let p=0;
 A.innerHTML=`<div style="font-size:22px;font-weight:700">Vui lòng chạm theo thứ tự số:</div><div class="big" style="font-size:54px">${seq.join(' → ')}</div><div class="pg" id="pb">${shuf(seq).map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div><div id="gm" style="min-height:26px"></div><button class="sec" id="x" style="height:52px;font-size:18px">Hủy</button>`;
 $('#x').onclick=home;if(Date.now()<lockUntil)$('#gm').textContent='Đã khóa, thử lại sau '+Math.ceil((lockUntil-Date.now())/1000)+' giây';
 $('#pb').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(Date.now()<lockUntil)return;if(+b.dataset.n===seq[p]){b.style.opacity=.3;if(++p===3){bad=0;dash()}}else{p=0;if(++bad>=3){bad=0;lockUntil=Date.now()+30000;$('#gm').textContent='Sai 3 lần, khóa 30 giây'}else{$('#gm').textContent='Chưa đúng, thử lại';$('#pb').querySelectorAll('button').forEach(x=>x.style.opacity=1)}}})}
function dash(){cur='dash';const t=D.t[day()]||0,m=Math.round(t/60),rt=k=>{const r=D.sk[k];if(!r||r[1]<3)return '⏳ Chưa đủ dữ liệu';const p=r[0]/r[1];return p>=.8?'✅ Tốt':p>=.6?'✅ Khá':'⏳ Đang phát triển'},LM=[0,15,20,30];
 A.className='dash';A.innerHTML=`<button class="sm" id="b" style="align-self:flex-start;padding:8px 14px;border-radius:14px;background:var(--peach);font-weight:700">← Quay lại</button><h2 style="margin:0">📊 TIẾN BỘ CỦA BÉ</h2><div>Thời gian chơi hôm nay: <b>${m} phút</b></div><div class="bar"><i style="width:${D.lim?Math.min(100,t/(D.lim*60)*100):Math.min(100,m*3)}%"></i></div><div>Điểm cao nhất: <b>${D.best} ⭐</b> · Số ván đã chơi: <b>${D.g}</b></div><div><b>Kỹ năng nổi bật:</b><br>🎨 Nhận biết màu: ${rt('color')}<br>🔷 Hình dạng: ${rt('shape')}<br>🔗 Ghép cặp: ${rt('pair')}<br>🔢 Đếm số: ${rt('count')}<br>🧠 Ghi nhớ: ${rt('mem')}</div>
 <div class="row">⏰ Giới hạn thời gian/ngày: <button class="sm" id="lm">${D.lim?D.lim+' phút':'Tắt'}</button></div><div class="row">🔔 Nhắc nghỉ mắt (10 phút): <button class="sm" id="ey">${D.eye?'BẬT':'TẮT'}</button></div><div class="row">🌿 Giảm hiệu ứng chuyển động: <button class="sm" id="rm">${D.rm?'BẬT':'TẮT'}</button></div><div class="row">◐ Tương phản cao: <button class="sm" id="hc">${D.hc?'BẬT':'TẮT'}</button></div>`;
 const back=()=>{A.className='';home()};$('#b').onclick=back;
 $('#lm').onclick=()=>{D.lim=LM[(LM.indexOf(D.lim)+1)%4];save();dash()};$('#ey').onclick=()=>{D.eye=!D.eye;save();dash()};$('#rm').onclick=()=>{D.rm=!D.rm;apply();save();dash()};$('#hc').onclick=()=>{D.hc=!D.hc;apply();save();dash()}}
document.addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
window.addEventListener('popstate',()=>{if(ov){ov=0;const o=$('#ov');if(o)o.remove();return}if(cur==='game'){if(sc>D.best){D.best=sc;save()}home()}else if(cur==='coll'||cur==='dash'||cur==='gate'||cur==='over'){home()}});
splash();
</script></body></html>
